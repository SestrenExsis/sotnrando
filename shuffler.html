        async function digestMessage(data) {
            const hashBuffer = await window.crypto.subtle.digest('SHA-256', data)
            const result = new Uint8Array(hashBuffer).toHex()
            return result;
        }

            const reader = new FileReader()

            .addEventListener('load', () => {
                // ...

                const buffer = new Uint8Array(reader.result)
                console.log(selectedFile.size)
                digestMessage(buffer)
                .then((digestHex) => {
                    console.log('Digest of disc image', digestHex)
                    const bin = new BinPatcher.GameData(buffer)
                    const extractionData = BinPatcher.processBinary(bin).extraction
                    const changesToApply = []
                    changesToApply.concat(BinPatcher.getDefaultChangeDependencies())
                    let patchData = BinPatcher.maskNodes(extractionData, 'data')
                    // Apply changes to patch file
                    changesToApply
                    .forEach((changesData) => {
                        for (const changeData of changesData.changes) {
                            BinPatcher.applyChange(patchData, changeData)
                        }
                    })
                    // Convert patch file to PPF
                    const result = BinPatcher.toPPF(patchData, 'Test')
                    console.log('PPF', result.length, result)
