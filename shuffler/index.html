    <script type="importmap">
        {
            "imports": {
                "seedrandom": "https://cdn.jsdelivr.net/npm/seedrandom@3.0.5/seedrandom.min.js",
                "sotn-shuffler": "https://cdn.jsdelivr.net/gh/SestrenExsis/SOTN-Shuffler@refactor/index.js"
            }
        }
    </script>
    <script>

        // import {
        //     getSeedName,
        // } from "sotn-shuffler"

        let data = {}

        function getExtractionFromBin(buffer) {
            const bin = new BinPatcher.GameData(buffer)
            const result = BinPatcher.processBinary(bin).extraction
            return result
        }

        function generatePPF(extractionData, changesToApply) {
            // Start with a blank patch file
            let patchData = BinPatcher.maskNodes(extractionData, 'data')
            // Apply changes to patch file
            changesToApply
            .forEach((changesData) => {
                for (const changeData of changesData.changes) {
                    BinPatcher.applyChange(patchData, changeData)
                }
            })
            // Convert patch file to PPF
            const result = BinPatcher.toPPF(patchData, 'Test')
            return result
        }

        async function digestMessage(data) {
            const hashBuffer = await window.crypto.subtle.digest('SHA-256', data)
            const result = new Uint8Array(hashBuffer).toHex()
            return result
        }

        function getShufflerOptions() {
            const result = {}
            console.log('getShufflerOptions()')
            const formElement = document.getElementById("shufflerOptions")
            // const submitter = document.getElementById("generateButton")
            const formData = new FormData(formElement)
            for (const element of formData) {
                switch (element.at(0)) {
                    case 'musicShuffler.on':
                        if (!('musicShuffler' in result)) {
                            result.musicShuffler = {}
                        }
                        if (!('on' in result.musicShuffler)) {
                            result.musicShuffler.on = true
                        }
                        break
                    case 'patcher.list':
                        if (!('patcher' in result)) {
                            result.patcher = {}
                        }
                        if (!('on' in result.patcher)) {
                            result.patcher.on = true
                        }
                        if (!('list' in result.patcher)) {
                            result.patcher.list = []
                        }
                        result.patcher.list.push(element.at(1))
                        break
                    case 'clockFaceDisplay':
                        if (element.at(1) === 'minutesAndSeconds') {
                            result.patcher.list.push('showMinutesAndSecondsInClockRoom')
                        }
                        break
                }
            }
            return result
        }

        document.getElementById('binFile')
        .addEventListener('change', () => {
            const selectedFile = document.getElementById('binFile').files[0]
            const reader = new FileReader()
            reader
            .addEventListener('load', () => {
                const buffer = new Uint8Array(reader.result)
                console.log('selectedFile.size:', selectedFile.size)
                digestMessage(buffer)
                .then((digestHex) => {
                    console.log('Digest of disc image', digestHex)
                    data.extraction = getExtractionFromBin(buffer)
                    const link = document.getElementById('downloadExtractionLink')
                    link.innerHTML = 'Download extraction.json'
                    link.download = "extraction.json"
                    const blobData = new Blob([JSON.stringify(data.extraction)], {
                        type: 'text/plain',
                    })
                    link.href = window.URL.createObjectURL(blobData)
                })
            })
            reader.readAsArrayBuffer(selectedFile)
        })
        
        document.getElementById('generateButton')
        .addEventListener('click', () => {
            console.log('data:', data)
            const shufflerOptions = getShufflerOptions()
            console.log('shufflerOptions:', shufflerOptions)
            const seed = Math.floor(Math.random() * Number.MAX_SAFE_INTEGER)
            const rng = new Math.seedrandom(seed)
            console.log('rng:', rng())
            console.log('rng:', rng())
            console.log('hex', BinPatcher.toHex(Math.floor(rng() * 0x100000000), 8))
            const address = new BinPatcher.Address('DISC', 0x12345, 0)
            // console.log(address.valueOf())
            console.log('seed:', seed)
            // document.getElementById('seed').value = getSeedName(seed)
            let changesToApply = sotnShuffler.core.getChangesFromOptions(shufflerOptions)
            changesToApply = changesToApply.concat(BinPatcher.getDefaultChangeDependencies())
            const ppfData = generatePPF(data.extraction, changesToApply)
            console.log('ppfData.length:', ppfData.length)
            // Create link to downloadable PPF
            const link = document.getElementById('downloadPPFLink')
            link.innerHTML = 'Download shuffler.ppf'
            link.download = "shuffler.ppf"
            const blobData = new Blob([ppfData], {
                type: 'application/octet-binary',
            })
            link.href = window.URL.createObjectURL(blobData)
        })
    </script>
